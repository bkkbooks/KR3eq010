body:
  text: 卷二婦科述略治婦人病必先明衝任之脈衝脈起於氣街在毛際兩旁並少陰之經挾臍上行至胸中而散任脈起於中極之下臍下四寸以上毛際循腹裡上關元又云衝任脈皆起於胞中上循背裡為經脈之海皆血之所從生而胎之所有系明於衝任之故本原洞悉不概治以男子泛用之藥自能所治輒效矣肝氣之病近時甚多婦女為尤甚即十餘歲之童女往往左脅下痞積脹滿嘔逆此先天之肝血不足也治以疏伐則劇治以滋養則平比比而然況乎天癸久轉生育頻多之婦人其血愈虧肝愈旺上犯胃脘下侵於足甚至納食即吐兩足攣痛致發痙厥此肝氣久痛必入於絡因血少不能流通其氣必滯非養血和絡補水滋木焉能療治世人概以謂東方常實有瀉無補遂皆以肝無補法論治殊不知肝氣之痛大半屬於水虧木熾所以逍遙散為治肝之始方並無瀉伐之品其中歸芍補肝白朮甘草補中加以柴胡煨姜為疏通之用氣平即繼以八珍湯調養之則自然所發漸輕若隨俗附和任意用枳殼香附青皮鬱金等破氣之藥元氣日益消耗陽衰則陰竭禍不旋踵矣景岳質疑難云肝無補法者以肝氣之不可補非謂肝血之不可補補肝血莫如滋腎水腎者木之母也母旺則子強是以當滋化源此千古之良法也夫將軍之官其性剛勁木火同居風乘火勢火助風威母贊其勝此言其氣實有餘也若求其本則乙癸同源滋陰養血尤為急矣婦人血結胞門則上焦之陽不得入於陰在下則小腹裡急五液時下在上則孤陽獨浮為嗔怒發熱口燥發厥治法先宜開痹破陰結不得一味滋膩致成蟲滿當看其虛實用景岳新陣柴胡飲六方柴陳煎歸柴飲解肝化肝煎等方因病加減治之較古方尤為靈動妊娠傷寒及溫熱症最難措手須辨舌胎張誕先舌鑑六條實為名論治宜宗之其一云孕婦初傷於寒見面赤舌上白滑即當微汗之以解其表如面舌俱白發熱多飲冷水陽極變陰所致當用溫中之藥若見厥冷煩躁誤與涼劑則厥逆吐利而死其二云面赤舌黃五六日裡症見當微利之庶免熱邪傷胎之患若面舌俱黃此失於發汗濕熱入里所致當用清利水藥其三云面舌俱黑水火相刑不必問其月數子母俱死面赤舌微黑者還當保胎如見灰色乃邪入子宮其胎必不能固若面赤者根本未傷當急下以救其母其四云妊娠傷寒溫熱見面舌俱赤宜隨症汗下子母無虞面色皎白而舌赤者母氣素虛當略用溫散法若面黑舌赤亦非吉兆若在臨月則子得生而母當殞其五云見面赤舌紫其人必嗜飲乃酒毒內傳所致如淡紫戴青為陰症夾食難治也即用枳實理中四逆輩亦難為力若面赤舌青母雖無妨子殞腹內急宜用芎歸湯合平胃散加朴硝下之以救其母其六云面黑而舌乾卷短或黃黑刺裂乃里症至急不下則熱邪傷胎下之危在頃刻如無循衣撮空直視等證十中可挽回一二妊娠傷寒傷風首宜固胎順氣雖見脈緊無汗不可用麻黃青龍及一切解表猛劑以風藥性升皆犯胎氣也鄭虛谷曰妊娠傷風無論時月及月分多少俱宜嚴氏紫蘇飲加蔥白為至穩古人用芩術安胎是因子氣過熱不寧故用黃芩苦寒以安之脾為一身之津梁主內外諸氣而胎息運化之機全賴脾土故用白朮以助之然惟形瘦血熱營行過疾而胎常上逼者宜之至若形盛氣衰胎常下墜者非人參舉之不安形盛氣實胎常不運者非香砂耗之不安血虛火旺腹常急痛者非芎歸地芍養之不安體肥痰盛嘔逆眩暈非芩半豁之不安此皆治母之偏勝也婦人墜胎與難產病之最險者也治墜胎往往用補澀治難產往往用攻下皆非正法蓋半產之故由於虛滑者半由於內熱者半得胎之後衝任之血為胎所吸無餘血下行血苟不足則胎必枯槁而墜其本由於內熱火盛陽旺而陰劫血益少矣治宜養血為先清熱次之若泥於膩補反生壅滯之害至於產育乃天地生生化育之理本無危險皆人之自作也用力不可太早早則胎先墜下舒轉不及胞漿先破胎已枯澀遂有橫生倒產之虞其治亦不外乎養血為主血生則胎自出若誤用攻下之藥則胎雖已產衝任大傷氣冒血崩危在呼吸矣慎之慎之胎前論治孕婦元氣不足倦怠腹鳴胎動或微熱減食煩渴宜服加味安胎飲人參八分制白朮一錢炒白當歸一錢五分炒砂仁三分炒研蘇葉四分陳皮四分炒熟地三錢炒鬆淡子黃芩八分炙草二分麥冬一錢孕婦或胃脘痛肝脹小腹墜痛腰痛皆名胎痛治宜加味參橘飲人參五分制白朮一錢當歸一錢五分製半夏六分新會橘紅六分鹽水炒藿梗五分炙甘草三分砂仁三分白芍一錢炒蘇梗六分生薑二分孕婦多怒胸腹滿悶宜服加減和氣安胎飲人參四分白朮七分炒當歸錢半川芎五分鹽水炒炙甘草三分蘇葉四分陳皮五分青皮四分炒炭石決明一錢五分煅孕婦面目虛浮四肢有水氣多因脾胃氣虛或久瀉所致宜健脾利水服全生白朮散人參四分茯苓二錢生白朮一錢五分淮山藥二錢炒扁豆二錢澤瀉五分炒大腹皮七分陳皮七分炒蘇葉四分炙甘草三分胎氣上攻心腹脹滿名曰子懸宜服順氣安胎飲人參五分白朮八分當歸一錢五分白芍一錢二分炒條芩八分炒蘇葉四分陳皮六分炒砂仁三分研茯苓一錢五分制香附八分受胎後尚有經來數點乃氣血盛也若不腰痠腹痛不必服藥如下血不止或按月下血名曰胎漏多因勞傷氣血或喜飲炙眊熱物或因房事宜服補中安胎飲人參一錢淡黃芩一錢阿膠一錢蛤粉炒珠白朮一錢歸身一錢五分炒生地二錢川斷一錢蘇葉四分白芍一錢炒炙甘草三分孕婦跌僕傷胎下血不止宜服膠艾安胎飲阿膠一錢蛤粉炒艾葉五分醋炙人參一錢白朮一錢川芎六分熟地三錢炒黃芩一錢酒炒當歸一錢五分陳皮五分炒蘇葉四分孕婦心驚膽怯煩悶不安名曰子煩宜服竹葉安胎飲竹葉十片人參八分麥冬一錢五分當歸一錢五分生地二錢棗仁一錢五分炒黃芩八分炒遠志肉四分甘草水炒焦川芎四分炙甘草二分陳皮四分炒孕婦脾虛氣弱飲食停滯嘔吐腹脹泄瀉宜服加味人參平胃散人參一錢茅蒼朮七分泔水浸炒炭厚朴七分薑汁炒炭陳皮四分炙甘草三分白朮八分炒山楂炭七分孕婦成胎之後兩足浮腫漸至腿膝行步艱難氣促喘悶面浮不思飲食甚至足指出黃水蓋脾主四肢脾氣虛弱不能制水肺腎少氣血滋養名曰子氣宜服天仙藤散天仙藤七分微炒香附六分制陳皮五分炒蘇葉四分甘草三分烏藥六分木瓜八分炒姜皮三分人參五分白朮一錢當歸一錢五分如元虛脾胃弱間服補中益氣湯孕婦口噤項強手足攣縮言語蹇澀痰涎壅盛人事不省名曰子癇不可作中風治宜羚羊角散羚羊角一錢棗仁一錢炒薏苡仁一錢當歸一錢五分獨活八分茯神一錢五分生甘草四分五加皮五分酒炒川芎六分防風五分木香二分苦杏仁十粒去皮尖薑汁一滴竹瀝一匙如體虛胃弱加人參白朮孕婦小便澀少或成淋瀝名曰子淋宜服加味安榮湯人參一錢當歸一錢五分白朮一錢麥冬一錢五分茯苓一錢五分通草五分生甘草五分燈草五分原方有北細辛不可用孕婦小便帶血宜清膀胱之火治以加味逍遙散當歸一錢五分白芍一錢炒柴胡四分白朮八分茯苓一錢五分丹皮一錢黑山梔七分生甘草三分或加生地二錢麥冬錢半亦妥孕婦小便癃閉少腹脹滿欲死徒利水無益也當用加味葵子茯苓飲冬葵子四錢茯苓六錢歸身一錢五分橘皮四分人參一錢五分麥冬二錢大腹皮七分孕婦臍腹脹痛或小便淋閉此脾胃氣虛胎壓膀胱宜服升提安胎飲人參八分白朮一錢二分熟地二錢當歸一錢五分川芎六分製半夏四分炙甘草三分陳皮四分去白柴胡四分升麻四分蜜炙如小便自利者升柴宜輕人參宜重如無血熱宜加生黃地孕婦遍身浮腫胸滿腹脹便閉名曰胎水不利宜服鯉魚湯合四君子湯白朮一錢茯苓四錢當歸二錢白芍一錢五分炒用活鯉魚一尾約重二斤去鱗腸加橘皮錢許生薑三片河水煮取魚湯加藥煎服虛者加人參一錢炙甘草四分孕婦感冒風寒咳嗽宜服寧肺散麥冬一錢知母一錢桔梗五分蘇葉五分生甘草五分杏仁一錢去皮尖橘紅四分桑皮八分如寒嗽加薑汁一匙竹瀝一匙熱嗽加黃芩一錢虛嗽加紫菀一錢川貝一錢若嗽不止胎動不安加人參一錢天冬一錢百合一錢五分歸身一錢炒焦白芍八分炒焦孕婦咳嗽吐血宜服涼血安胎飲生地三錢天冬一錢紫菀一錢知母八分白朮八分蜜水炒麥冬一錢歸身一錢陳皮四分炒甘草四分黃芩四分孕婦霍亂吐瀉心煩腹痛先服六和湯繼服安胎飲人參一錢木瓜八分炒扁豆三錢茯苓一錢五分製半夏五分砂仁三分研陳皮六分炒藿香五分甘草三分杏仁錢半去皮尖竹茹六分生薑一片大棗二枚煎服安胎飲蜜炙黃耆八分杜仲二錢茯苓一錢五分黃芩一錢生白朮八分阿膠一錢川斷一錢五分炙甘草三分蘇葉四分陳皮六分加糯米百粒孕婦瘧疾往來寒熱宜服六和安胎飲人參五分白朮八分歸身一錢五分川芎四分條芩八分炒製半夏五分藿香六分蘇葉四分茯苓一錢五分砂仁二分重者加柴胡三四分孕婦壅熱心神煩躁口渴舌乾或舌苔黃黑宜加減參麥散人參五分廣皮四分歸身一錢鹽水炒知母一錢條芩八分炒麥冬一錢五分石斛二錢孕婦熱病斑疹紫赤小便短赤氣急欲絕腹痛胎欲落之象症雖危險宜服梔蔥豉湯以救之黑山梔一錢黃芩一錢升麻四分青黛五分鮮生地二錢淡豆豉四十九粒杏仁十粒去皮尖石膏一錢五分蔥白七寸孕婦嘔吐不食胸中煩躁宜生津葛根湯人參五分麥冬一錢梔子八分炒黑知母八分葛根七分煨竹茹六分蘆根二錢蔥白二寸孕婦吐血衄血忽然口噤項強背直皆失血所致非類中風也宜加減安胎飲人參一錢當歸一錢五分炒白朮一錢大生地二錢條芩八分純鉤藤鉤二錢荊芥四分炒黑陳皮四分炒甘草三分麥冬一錢去心孕婦每三月殞胎是肝虛血不能養胎也宜人參阿膠湯預先服之人參一錢阿膠一錢五分蛤粉炒珠當歸一錢五分水炒川芎四分白芍一錢二分炒桑寄生一錢二分孕婦傷胎胎死腹中口噤昏沉腹中脹痛血上衝心急宜服佛手散當歸六錢川芎三錢水七分酒三分煎服數劑臨產交骨不開及橫生倒產宜急服加味芎歸湯當歸一兩川芎四錢敗龜板一具陳酒炙捶碎婦人頭髮如雞子大一團洗淨瓦上炙灰存性如久而虛欲脫者加人參熟地牛膝酌量用之開支河之法也二寶湯方全白當歸一錢五分川芎八分羌活三分厚朴五分薑汁炒荊芥穗七分菟絲餅一錢五分陳枳殼五分去穰麩炒生黃耆八分川貝一錢去心白芍一錢酒炒甘草四分蘄艾五分醋炒炭姜一片一方羌活厚朴換蘇葉藿香此方專治一切胎症未產能安胎臨產能催生懷孕五月後腰痛腹痛服之即愈分娩時交骨不開橫生逆產或子死腹中服之能下懷妊五月後每月服二三劑臨盆容易子母俱全故名二寶湯異人傳下不可輕忽視之
