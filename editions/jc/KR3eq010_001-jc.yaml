body:
  text: 卷一雜症述略爛喉發癍疹近時甚多在稚年不治者十有八九何也其根由於種痘近時嬰孩稟質既薄痘師防其發點繁多下苗甚輕多者數十顆少者不過數顆而先天臟腑之毒未經盡透一遇時感傳染乘機而發治之以寒涼之劑則必至下陷治之以透表之劑則又邪未達而本先撥蘊伏咽喉隨即潰爛而亡其危可勝言哉讀金匱書有陽毒之為病面赤斑斑如錦紋咽喉痛吐膿血五日可治七日不可治升麻鱉甲湯主之之文蓋以升麻透厲毒鱉甲泄熱守神當歸和血調營甘草瀉火解毒即內經所云熱淫於內治以鹹寒佐以苦甘之旨繹其意實與此症相類而方內有蜀椒雄黃似當加於陰毒方中或因傳寫之訛醫者當息心揣度用古而不泥於古轉機則在於臨症活變也李云浦云爛喉痧一症風熱者宜清透濕熱者宜清滲痰火凝結者宜消降蓋邪達則痧透痧透則爛自止若過用寒涼勢必內陷其害不淺但其證有可治有不可治口中作臭者謂之回陽其色或淡黃或深黃此係痰火所致皆可治也如爛至小舌鼻塞閤眼朦朧是毒氣深伏元氣日虛色白如粉皮樣者皆不可治也爛喉發癍斑半由於元虛不正時邪易於感染重者用紫背浮萍生石膏等藥透毒解熱稍輕者只宜用大力子桑葉杏仁連翹桔梗荊芥萆薢花粉輕清之品清邪化熱不得早用大生地麥冬等以膩之亦斷不可用黃連黃芩太苦大寒等品以遏此等時證其勢危速須細心詳慎審脈察色庶幾不致誤治也南人多溫熱病而少真正傷寒不可概從六經論治蓋傷寒六日傳遍多有變證溫熱惟留戀一經或傳入營分從風從濕必潛心細究於舌色尤為先務葉天士前輩溫熱論治數條發前人所未發最為切要學者宜宗法焉邪之所湊其氣必虛故曰不能治其虛焉問其餘然亦不可執也強壯之人思慮應酬之間為淫邪賊風所乘或自恃脾強過啖甘肥炙眊釀成膠痰實火亦宜發表攻裡如河間推陳致新之法有何不可若因循顧忌治不中肯久則反傷正氣所謂五虛死五實亦死又云毋實實毋虛虛是也若不論虛實動手便用補益執扶正化邪之說與膠柱而鼓者何異耶瘧病無汗要有汗固矣至於有汗要無汗亦不可不斟酌也雖有虛實之不同其根未有不因暑邪內藏陰邪外束所致暑為陽邪陽邪多汗故瘧往往有汗豈可因其汗多早加固表之藥以致病情反覆故古人但言久瘧扶正為主未嘗言固表也愚謂汗少不妨更發汗汗多不必再發汗但以輕清和解治之可也衛屬陽其氣慓悍故行速營屬陰其氣靜翕故行遲瘧邪之間一日及連二日發者邪之著於營也如周天之數日行過之月行不及亦是陰陽遲速之分耳治疫之法解毒為先務吳又可專用大黃驅逐毒穢但近時之人體氣多薄攻蕩難施莫若張路玉用人中黃配蔥豉等解毒藥為起首方葉天士用銀花金汁涼解之品最為穩當喻氏云上焦如霧升而逐之佐以解毒中焦如漚疏而逐之佐以解毒下焦如瀆決而逐之佐以解毒觀其旨病有上中下之分而獨於解毒一言叮嚀再四豈非急於解毒之法哉疫者穢惡之氣互相傳染吳氏謂從口鼻而入即踞膜原但口鼻吸受肺為出入之門戶無有不先犯肺者疫皆熱毒肺金所畏每見此症身熱先有憎寒肺先病也繼而充斥三焦或有逕走心包絡者所謂厲氣無非鬱熱也至於疫邪漸解而肺蓄餘熱每多咳嗆肌熱自汗等證亦所謂肺先病而未愈之明徵也今人每遇房勞遺泄之後偶感風寒發熱即謂之陰證病者怕虛醫者怕表不問現症如何竟用參地附桂溫熱峻補之劑是則先補實其風寒於腎中矣邪何由出耶夫所謂陰證者寒邪中於三陰經也即使中於腎經亦須先散少陰之風寒如傷寒論中少陰發熱仍用麻黃細辛發表之法是也若果直中三陰身不壯熱有惡寒倦臥厥冷喜熱等症亦且先宜溫散漸進滋補之法此理不可不細辨也大概治膏粱者多滋養治藜藿者多消散然膏粱之體易生痰積由其多食厚味也亦宜消散藜藿之人易於清減由其自奉淡薄也亦宜滋養所謂人情物理不可執一以施病有在下者其見證反在上如蓄血發狂是矣在上者反在下如肺氣壅大便頻肺氣虛小便數是矣在表者反在裡如三陽合病下利是矣在裡者反在表如熱深厥亦深及面反戴陽是矣治宜細察衛為陽風為陽邪中風者陽虛不能衛外以類相從也故多顯陽熱之症治宜求受病之本毋徒事於風藥以重虛其表傷寒論云能食者為中風不能食者為中寒則傷寒內中風之症未嘗禁其食也又云欲飲水者稍稍與之蓋實火煩渴得水則解未嘗禁冷水也乃醫者凡遇此症恐其傷胃禁止勿與是亦背先賢之在旨矣陰虛則陽無所附氣有升無降法當以滋陰藥為君斂降之藥為佐苟徒降其氣則濁未必降而清且隨虛矣陽虛則氣中斷氣有降無升法當以補中藥為君升舉之藥為佐苟徒升其氣則清未必升而濁且隨干矣此治陰陽之偏虛也外此或七情逆滯或氣血飲食痰阻礙於中焦妨其升降出入之路其人元氣未虧不妨升之降之也此後天有形之氣血調治之理至若先天元陰元陽則陰虛陽必薄陽虛陰必乘但當峻補陰陽無暇為升降標計也陽虛而見陽熱之症是真火無根而脫出也陰虛而見陽熱之症是陰虛陽無所附而然也陽盛而見陰寒之症是陽盛拒陰也陰盛而見陽熱之症是陰盛格陽也四者用藥不當生死反掌腎者胃之關從陽則開從陰則闔陽太勝則開而為消陰太勝則闔而為水明矣仲景治水腫主之以腎氣丸而治消渴亦然寧不與陽盛有乖乎然而此之消是腎中陽虛不能收攝也此之渴是腎中陰虛引水自救也喻氏謂腎水下趨故消腎氣不上騰故渴均用此丸蒸動腎氣恐未必然咳嗽之症大半由於火來剋金謂之賊邪最難速愈因風寒外襲而內生實火急宜瀉之若失於提解久之傳變生痰誤服陰藥反成癆瘵如果系虛火惟有壯水一法但養陰之藥又皆阻氣滯痰是在治之者靈也如生脈六君湯金水六君煎之類最為妥當腎虛水泛為痰有腎中陽虛腎中陰虛陽虛津液洋洋泛溢味淡起沫治宜補氣以生陰則上泛可降陰虛咳唾痰涎味鹹黏膩治宜益水以潛陽則咳唾可平治不可雜也鼓膈為難治之病然鼓猶可治膈斷不可治鼓多實證或痰或血或氣或食或水凝結於中能先下其滯繼以補養腸胃漸能運化矣內經雞矢醴之方即治法也至臂細臍凸青筋繞腹手心及背平滿此臟氣已絕死不治若膈證始由肝火犯胃木來侮土謂之賊邪所以肝陰素虧津液不足之體嘔逆不止久成噎膈以至胃汁枯槁痰涎壅塞食不下達仍復吐出此病在賁門固與反胃之證朝食暮吐暮食朝吐病在幽門者判然兩途經云谷入於胃以傳於肺五臟六腑皆以受氣今既食不能入則臟腑之氣皆竭矣故見此病少可納穀不出一年而死全不納穀不出半年而死春得病死於秋秋得病死於春金水相剋之時也心腎不足小便渾濁中氣不足溲便為之變色要知金衰則水涸水涸則小便短數而渾濁氣不足則易郁鬱則生熱熱生則溺色變為黃赤矣當求其本而治之若徒執水液渾濁皆屬於火概施利水清熱之品必致反增其病腳氣之病多由濕熱因濁邪下先受之也膏粱者濕熱內生藜藿者濕熱外侵治宜分利滲濕固也若有陰虛之極不能吸氣歸元陽虛之極不能攝血歸經陰陽偏勝升降失司於是陽獨浮於上陰獨沉於下足至暮則腫痛矣治又宜補陰益氣不可概施分利滲濕以重傷其陰陽是在觀形察脈以細求之有思慮傷脾脾虛不能統血而失出者有思慮傷脾脾衰不能消穀而泄瀉者失血斷不宜用涼血泄瀉不宜用消導以致脾氣愈傷皆當扶養脾土為本勿徒治其標平脈云少陰脈不至腎氣微少精血奔氣迫促上入胸膈夫少陰脈不至是先天元陽元陰受傷腎者先天也脾胃者後天也先天既已受傷則不能生乎後天故脾胃之陰陽亦傷不能運化水穀而生濕熱濕熱下流則膀胱之氣化不行濁氣因而上入濁氣上入肺氣便壅脾氣愈滯於是為痰為飲而食滯腹脹之症形焉其少陽生髮之氣鬱而不得升為周身刺痛為嘔逆吞酸心主之陽為濁陰所乘則為心悸怔忡是腎之一臟腑而五臟六腑皆為之不寧故養身莫妙於節欲也若不知此而但以利氣行痰消食為治則燥以傷其陰利以傷其陽不坐困乎此專主腎虛而言也諸痛無補言氣逆滯也然壯者氣行則愈怯者著而成病真氣虛乏之人諸邪易於留著著則逆逆則痛疏刷之中不可無補養之品徒事攻擊則正愈虛邪愈著而痛無休止也所以脾胃亡液焦燥如割宜用地黃養陰等以潤之脈陽澀陰弦腹中急痛當用小建中湯肝血不足兩脅脹滿筋急不得太息四肢厥冷心腹引痛目不明瞭爪甲枯面青宜補肝湯腎虛羸怯之人房勞過度胸膈間多隱隱痛此腎虛不能約氣氣虛不能生血之故往往凝滯而作痛宜用破故紙萸肉枸杞等溫腎歸芍等養血至於頭痛有氣虛有血虛有腎虛皆不可無補也風溫溫瘧之病其根得之於冬令中於風寒遇溫而發其氣自內而達於外故多汗不比風邪外束閉其營衛當發汗解肌也治故以發表為逆亦不可因汗而斂之致變別病務以清解得宜吐血一證繆氏云治有三訣宜行血不宜止血血不循經絡者氣逆上壅也行血則使循經絡不止自止若用硬止之劑血必凝血凝則發熱惡食病日痼矣宜補肝不宜伐肝肝主藏血吐者肝失其職也養肝則肝氣平而血有所歸若使伐肝則肝愈虛血愈不止矣宜降氣不宜降火氣有餘便是火氣降則火降火降則氣不上升血隨氣行無溢出上竅之患矣若使先降火必用寒涼之劑反傷胃氣胃氣傷則脾不能統血愈不歸經矣吐血入水浮者肺血沉者肝血半沉半浮者心血色赤如太陽紅者腎血肺血宜保肺不宜瀉肺肝血宜養肝不宜伐肝心血宜補心不宜瀉心腎血宜滋腎不宜涼腎若使久吐不止血已大虛當用溫補以健脾胃使脾和則能裹血也若暴吐不止急用大劑參術以急固元陽血脫益氣陽生陰長之理也如一味以生地苓連知柏黑梔寒涼陰膩之屬清其火則脾傷作瀉發熱咳嗽勢必至於不救矣幼科驚證自喻氏以食痰風驚四字立名大剖從前之訛原為確論然亦有未盡者近多冬令氣暖失藏入春寒溫間雜小兒吸受其邪先傷肺經起自寒熱氣粗久延漸入包絡雖有微汗而痰多鼻煽煩躁神昏病家惶懼輒云變為驚風動用香開妄投金石重鎮以致陰液消亡熱勢愈張正不敵邪肝風陡動漸見肢牽目竄痙閉發厥必多傾敗若能於病未猖獗之時先以辛涼開肺繼以甘寒化熱佐以潤燥降痰兩候自能平復此蓋溫邪陷入陰液內耗而動肝風實非驚恐致病也若誤以驚藥治之鮮有不危殆者矣內經云臨病問所便蓋病人之愛惡苦藥即病情虛實寒熱之徵醫者之切脈望氣不若問病人使自言以推求其理為確如身大熱而反欲飲熱則假熱而真寒身寒戰而反欲飲冷則假寒而真熱如此之類是也所以病人之喜好不妨從病人之便即可以治其病病者之性情不同醫者之意見各異人有能受溫熱不能受寒涼者有受補有不受補者必須順其性察其情現症有與平素相反者有與平素不相遠者不可執己見誤治其標本也近時醫家每用囫圇古方硬引經語以自矜淵博殊不知古賢立方與人以規矩不能使人巧蓋規矩做方做圓之呆法而作器長短大小時時變通所以病情古今無印板式樣即方無一定呆藥必須加減寓變通於成法之中斯神乎技矣
