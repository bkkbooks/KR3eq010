body:
  text: 卷三產後述略婦人之病莫重於產後因氣血大虧內而七情外而六氣稍有感觸即足致病且多疑似之症毋徒以逐瘀為事以致變端百出讀金匱書中有用大黃等峻劑者非古人立法之不善也蓋以古時稟氣之足或西北地土堅厚人亦強壯用之良善至於吾地體質柔弱深閨嬌養豈能受此侵克此看病之不可泥於古也時人每謂產後不可補恐其瘀阻往往用蘇木紅花等行瘀為先務設或血行不止立見厥脫急難措手可不懼哉丹溪云產後以大補氣血為主雖有他症以末治之王肯堂云產後用下藥者百無一生誠哉是言也金匱要略云新產婦人有三病一病痙二病鬱冒三病大便難新產血虛多汗出善中風故令病痙亡血復汗寒多故令鬱冒亡津液胃燥故大便難心典云血虛汗出筋脈失養風入而益其勁此筋病也亡陰血虛陽氣逆厥而寒復郁之則頭眩而目瞀此神病也胃藏津液而滲灌諸陽亡津液胃燥則大腸失其潤而大便難此液病也三者不同其為亡血傷津則一故產後血虛諸症由此而類推之則不致誤治矣產後諸病總宜以生化湯為主隨症加味可也竹林寺世傳秘本生化湯論云產後血氣暴虛理當大補但惡露未盡用補須知毋滯血能化又能生無損元虛行中帶補方為萬全世以回生丹治以下胞胎攻血塊雖見速效未免虧損元氣非良劑也不得已而用之只可服一丸以參湯下之庶無虞耳夫生化湯以藥性功用而立名也夫產後瘀固當消新血宜生若專消則新血不寧專生則舊血反滯考藥性芎歸桃仁善破惡血驟生新血佐以炮薑甘草引三品入肺肝生血理氣五味共方則行中有補化中有生實產後之要藥也加減得宜是在臨證者之善悟可耳又論產後治法云夫產後憂驚勞倦血氣暴虛諸症乘虛易起如有氣勿專耗散有食勿專消導熱不可用芩連寒不可用桂附用寒則血塊停結用熱則新血崩流至若虛中外感見三陽表症似可汗也在產後而用麻黃則重竭其陽見三陰里症似可下也在產後而用承氣則重亡其陰耳聾脅痛乃肝腎惡血之停休用柴胡譫語汗出乃元弱似邪之症毋同胃實厥由陽氣血衰無分寒弱非大補不能回陽而起弱痹因陰血之虧不論剛柔非滋榮不能舒筋而活絡乍寒乍熱發作有期類瘧也若以瘧治則遷延難愈神不守舍言語無倫似邪也若以邪論危亡可待去血多而大便燥結蓯蓉可加於生化湯中非潤腸承氣之為患汗多而小溲短澀六君子倍多參耆必生津助液之可利加參生化頻服能救垂絕之危長生活絡能用可蘇絕谷之人頹疝脫肛多是氣虛下陷生化可參用補中益氣口噤拳攣乃因血燥類瘋加參生化宜服產戶入風而痛甚服宜羌活養榮玉門寒冷而不閉洗宜床菟萸硫類怔忡驚悸生化加定志之品似邪恍惚生化加安神之法因氣而虛煩滿悶生化加木香為佐因食而酸噯惡食合六君加神麯麥芽為良不可用蘇木薐蓬以破血不可用枳實青皮以消脹血崩血暈之危汗脫氣脫之急連煎加參生化湯為最要務也王太僕云治下補下制以緩急緩則道路遠而力微急則氣味厚而力重丹溪云產後切不可發表故治產固本當遵丹溪服法宜效太僕生化湯原方分兩斟酌在臨用變通也川芎二錢白當歸四錢炙甘草五分炒黑乾薑四分單桃仁十粒去皮尖水二盅陳酒半小杯沖服產後血暈因勞倦去血過多氣竭神昏而暈不可誤認為惡血衝心投散血之劑不可誤認為痰火鬱冒用消降之方宜服加味生化湯歸身三錢川芎一錢五分炮姜四分桃仁十粒去皮尖炙草四分荊芥炭五分如汗多加人參一錢產後厥逆因勞傷脾孤臟不能注於四旁故足冷而厥氣上行經云陽氣衰於下則為寒厥是也宜加參生化湯滋榮復神湯加參生化湯人參一錢川芎一錢五分歸身四錢桃仁十粒炙甘草五分炮姜五分橘紅四分鹽水炒滋榮復神湯川芎一錢白朮一錢制黃耆二錢炙人參一錢五分當歸三錢熟地三錢炒麥冬一錢炙甘草三分五味子十粒茯神二錢熟附子四分陳皮四分炒如大便不通加蓯蓉一錢五分產後血崩如紫色有塊是敗血未盡當用原方生化湯加澤蘭葉一錢五分如血鮮紅色大來或因驚傷心怒傷肝勞腸脾血則不能主不能藏不能統陰絡大傷矣症甚急當用升舉生化湯人參一錢五分制白朮一錢五分歸身二錢炒焦炙黃耆一錢熟地炭三錢荊芥炭四分陳皮四分炒升麻三分蜜炙白芷三分炒炭川芎六分鹽水炒焦淡附子二分炙甘草四分如汗多加淮小麥四錢焙產後氣短似喘因血既暴去氣必上竄脾失健運不能上輸於肺所以呼吸短促言語不相接續急服加參生化湯續氣養榮湯若認為痰火而妄議散氣化痰之方誤事多矣續氣養榮湯歸身四錢川芎一錢炙甘草四分炮姜四分人參一錢五分炙黃耆一錢制白朮一錢熟地炭三錢陳皮四分炒如煩渴加麥冬一錢五分五味子十粒炒如大便閉加淡蓯蓉二錢傷食加神麯八分炒楂炭一錢砂仁三分汗多加浮小麥四錢炒如手足冷加淡附子三分產後妄言妄見由氣血兩虛魂魄無依也不可誤認為邪祟噴以符水驚以法尺多致不救丹溪云虛病似邪祟是也又云欲泄其邪當補其虛宜服安神定志生化湯棗仁一錢五分炒熟遠志四分炒柏子仁一錢五分勿研麥冬一錢五分炒歸身三錢川芎一錢桃仁七粒去皮尖炙甘草四分炮薑炭四分人參五分加龍眼肉五個產後去血過多防血脫氣短如喘防氣脫汗多妄言妄見防神脫雖有血陰氣陽之分而精散魂去之促無異若非厚藥急方濃煎頻服奚能有救宜服大補生化湯人參一錢五分熟地四錢炙黃耆一錢五分淡附子三分五味子十粒制冬朮一錢麥冬一錢五分白桃仁八粒歸身三錢川芎八分炮姜四分炙甘草三分產後傷食因形體勞倦脾胃俱虛不思食而強與之胃雖勉受脾難轉運食停痞滿噯腐吞酸必須健脾助胃加以輕品消導之藥則食化脹平斷不可用峻劑消之致傷元氣宜服健脾消食生化湯歸身三錢川芎一錢焦白朮一錢焦神麯一錢焦麥芽一錢陳皮五分炒炙甘草四分如傷肉食加焦山楂一錢砂仁四分或以絹包炒熟麩皮加芒硝少許揉熨更穩產後因忿怒氣逆胸痞不舒宜用木香生化湯煨木香二分歸身三錢川芎一錢炮姜四分陳皮四分炒產後類瘧寒熱往來應期而發此元虛而外邪易侵不可作泛常瘧治有汗宜用滋榮扶正化邪生化湯無汗頭痛加減養胃湯歸身三錢川芎一錢人參一錢炙甘草四分麥冬一錢五分陳皮四分炒炙黃耆八分藿香三分荊芥炭六分生薑四分河井水煎服加減養胃湯當歸三錢川芎一錢二分藿香梗四分炙甘草四分人參一錢焦白朮一錢茯苓一錢五分製半夏八分橘皮四分姜皮二分酒炒柴胡三分產後七日內外發頭痛惡寒類太陽症潮熱自汗大便不通類陽明症往來寒熱口苦脅痛類少陽症皆由氣血兩虛陰陽不和類外感傷寒治者慎勿輕產而重傷寒以麻黃柴胡等湯治之也蓋產婦血脫之後而重發汗虛虛之禍不可勝言仲景有云亡血家不可發汗丹溪云產後切不可發表古賢立說皆具至理即使真感傷寒生化湯內芎姜亦能散邪且內經云西北之氣散而寒之東南之氣溫而收之即病同而治亦異至如產後屬虛無分南北當於溫補中少佐辛散可也宜祛邪生化湯歸身三錢川芎一錢五分炙甘草四分炮姜四分羌活四分桃仁十粒去皮尖防風四分蔥白七寸如虛者加人參五分產後頭痛口燥咽乾而渴類少陰症腹痛液干大便實類太陰症汗出譫語便閉痙厥類厥陰症多由勞倦傷脾運化稽遲氣血枯竭腸腑燥涸乃虛證類實承氣諸湯斷不可施宜養正通幽湯當歸四錢川芎一錢五分炙甘草四分陳皮四分桃仁十粒去皮尖肉蓯蓉一錢麻仁一錢如汗多加人參一錢黃耆一錢口渴加人參一錢麥冬一錢五分腹滿液干加人參一錢大腹皮一錢汗出譫語便閉加人參一錢熟棗仁二錢柏子仁二錢茯神二錢遠志肉四分麥冬一錢五分產後血氣暴竭百骸無以涵濡卒爾口噤牙關緊閉手足攣急症類中風不可任用中風劑也蓋沖為血脈之海血脈空虛關節不能流利治當先服生化湯以生旺新血如危極即服滋榮活絡湯救之熟地三錢人參一錢炙黃耆一錢歸身四錢川芎一錢茯神一錢五分天麻六分煨麥冬一錢荊芥四分防風四分羌活三分陳皮四分炙甘草四分如有痰加製半夏一錢薑汁一匙竹瀝一匙有食加山楂炭一錢五分焦神麯一錢大便閉加柏子仁二錢蓯蓉一錢五分驚悸加熟棗仁二錢言語恍惚加遠志肉四分炒石菖蒲四分炒棗仁二錢炒產後汗出不止亡陽之徵也蓋汗為心之液又腎十五液血去而心腎大虧必須急補心腎益榮衛而噓血歸源則汗自止宜補陽益陰生化湯以救之人參一錢五分熟地三錢炒炙黃耆二錢炙甘草四分歸身三錢川芎一錢炮姜四分煅牡蠣二錢制白朮一錢桃仁六粒去皮尖浮小麥一撮如渴加麥冬一錢五分五味子十粒產後舌燥口渴兼小便不利由產後失血或汗多所致治當助脾益肺調養氣血則津液生而小便自利矣斷不可用芩連知柏以降之五苓等劑以通之宜服生津止渴益水散炙黃耆一錢五分人參一錢五分熟地三錢炒五味子十粒麥冬二錢歸身三錢川芎一錢茯苓一錢五分生甘草三分炙升麻三分產後小便不禁是氣血虛不能收攝腎氣宜加味生化湯鹽水炒益智仁四分煅牡蠣三錢北五味十粒歸身二錢炙黃耆一錢川芎一錢桃仁十粒去皮尖炮姜四分熟地三錢覆盆子八分菟絲子一錢炒炙甘草四分產後泄瀉非雜症餐泄洞瀉水穀下注之比大率氣血虛易於食積傷濕所致宜消補兼施加味參苓生化湯白朮一錢土炒人參一錢茯苓二錢川芎一錢當歸二錢土炒炮姜四分炙甘草四分焦神麯五分焦麥芽八分廣皮四分澤蘭一錢如有寒加生薑一片大棗二枚如熱去炮姜加金石斛三錢如痛加煨木香四分如至五更而甚者加煨肉果四分產後完穀不化因勞倦傷脾而轉輸稽遲也又有飲食太過脾胃受傷當血塊未散之時患此脾敗胃弱之症宜先服香砂生化湯繼服加味參苓白朮散乃可無虞香砂生化湯砂仁三分炒研益智仁三分炒歸身三錢土炒焦川芎一錢炙甘草四分炮薑炭四分澤蘭一錢五分焦鍋粑五錢加味參苓白朮散人參一錢白朮一錢五分土炒茯苓二錢歸身三錢土炒川芎一錢炮姜四分炙甘草四分益智仁三分炒澤蘭一錢五分白芍藥八分酒炒炭廣皮四分炒煨木香二分產後患赤白痢疾後重頻並最為難治須行不損元補不助邪惟生化湯去炮姜加木香茯苓則可以並治而不悖也後立數條斟酌用之一產痢黃色乃脾土真氣虛宜服加味補中益氣湯加煨木香四分煨肉果四分一久痢元氣下陷肛門如脫宜服六君子湯加木香四分煨肉果四分乾薑四分炒歸身三錢土炒升麻三分一久痢四肢浮腫宜四君子加木香四分五加皮四分歸身二錢土炒一產痢臍下急痛生化湯加木香四分大腹皮六分白朮一錢土炒一產痢嘔吐生化湯加廣藿香五分製半夏五分焦白朮一錢陳皮四分一產痢小便短澀生化湯加茯苓二錢木香三分人參四分澤瀉一錢一產後血痢過多日久不止血分虛也宜四物湯加人參一錢荊芥炭五分淮山藥三錢白朮八分產後膨脹皆因中虛傷食多氣瘀積所致也中虛宜加參生化湯內加陳皮五分多氣生化湯內加川鬱金五分砂仁三分炒研傷食生化湯內加白朮炭六分焦麥芽八分焦神麯八分瘀積生化湯內加沙糖炒山楂一錢五分新絳一錢五分陳皮四分以上四症如虛必須人參隨機酌用產後霍亂因血虛陰陽升降不順清濁亂於腸胃冷熱不調邪正相搏遂上吐下瀉宜生化六和湯川芎一錢歸身三錢炮姜三分炙甘草三分茯苓一錢五分砂仁四分陳皮四分藿香五分如手足厥冷無塊痛者加人參一錢白朮一錢淡附子三分產後嘔逆不食人之胃腑為水穀之海水穀之精化而為氣血榮潤臟腑產後空虛寒邪易乘入於腸胃則氣逆嘔惡而不食也初宜生化湯加砂仁治七日後始用溫胃丁香散歸身二錢白朮一錢乾薑三分丁香二分人參一錢陳皮五分炙甘草四分半夏曲五四炒藿香四分產後水腫肢體俱浮皮膚光澤乃脾虛不能制水腎虛不能行水宜實脾飲香砂六君子湯金匱腎氣丸濟生腎氣丸因證擇用斷不可用破滯行水之藥丹溪治產後誤服消導藥以致水腫方人參二錢白朮二錢歸身三錢木通六分白芍一錢炒焦茯苓二錢澤瀉一錢炒厚朴五分炒蘇葉四分陳皮五錢木香四分大腹皮六分萊菔子六分炒又加味五皮飲五加皮四分地骨皮六分大腹皮六分茯苓皮三錢生薑皮三分加人參一錢歸身二錢白朮皮一錢陳皮四分產後驚悸怔忡因驚憂勞倦去血過多惟宜補養心血調和脾胃病自漸安後列二方加減養榮湯人參一錢五分歸身三錢川芎一錢茯苓二錢熟棗仁二錢麥冬一錢五分遠志四分炒炙黃耆一錢白朮一錢陳皮四分炙甘草四分龍眼肉一錢如虛煩加竹茹八分薑汁炒有痰竹瀝三匙薑汁一匙養心湯黃耆一錢炙茯神一錢五分歸身二錢川芎八分麥冬一錢去心遠志四分棗仁一錢五分炒研柏子仁一錢五分勿研五味子十粒炒人參一錢炙甘草四分產後骨蒸乃陰虛生內熱也宜保真湯加減治之人參一錢白朮一錢茯苓二錢知母一錢炒炭生地二錢炒炭熟地二錢炒炭麥冬一錢白芍一錢炒焦枸杞子一錢川芎一錢五味子十粒甘草四分此方繁多須臨病斟酌加減用產後胃脘痛因血虛肝氣上犯或由風冷乘虛襲入皆宜生化湯加泡淡吳茱萸三分陳皮四分如遍身疼痛宜服趁痛散歸身三錢炙黃耆一錢白朮一錢牛膝炭八分上肉桂二分獨活四分薤白四分炙甘草四分如痛喜手按屬大虛加熟地三錢川斷一錢五分酒炒如少腹結痛加川芎一錢延胡七分酒炒產後感冒風寒傷冷腰痛不能轉側宜服養榮壯腎湯當歸二錢獨活四分桂心四分川芎一錢杜仲三錢防風四分川斷一錢五分桑寄生一錢五分酒炒生薑三分如虛加熟地三錢產後血塊已消腹中空痛不止宜服交加地黃湯人參一錢當歸三錢川芎一錢白芍炭八分煨木香三分沒藥四分制香附四分熟地炭三錢煨姜三分大棗一枚產後或敗血或濕痰乘虛流注宜服參歸生化湯人參一錢馬蹄香一錢當歸三錢川芎一錢五分生甘草四分炙黃耆一錢五分肉桂四分茯苓二錢以上產後論治數條雖未能全備症情而遍考方書摘取純正試之輒效刊以質之同人未必無小補耳予凡看胎產諸症已二十餘年遇大險大危之候竟得十中挽回七八者皆以用補得宜不隨世俗以治標逐瘀為先務也壽喬識
