front:
  text: 序歲庚申薄遊西冷賣藥葛仙嶺下青山寂歷丹灶空明稚川有知應亦笑人千古也我友壽喬幼耽繡虎壯悔雕蟲宏景之閣三層雁湖之水一曲常日攤書有時倚棹寄身於材不材間寓巧於元之元外惜盈盈三十里賞析為難玉屑珠霏空付停雲落月中耳歲籥初更嚶鳴綦切爰偕二三舊雨訪壽喬於一隅草堂積雨新霽空翠滿庭延佇既久皓魄漸升乃斟桂醑載啓瑤編循環雒誦沁入心脾半生疑竇一旦冰釋嘻幸已憶豫與壽喬交迄今垂二十餘年矣屈指故人如雪泉石帆梨谷諸君子悉皆化為異物而計然七榮沈約一圍猶得鴻爪雪泥一話當年陳跡雖青青雙鬢漸覆成絲亦可見吾兩人之長鑱白木劚術尋苓未始非人間世大自在法也二月初吉壽喬將官廣文間云出岫本自無心而故山猿鶴有待招尋爰於諸公祖帳之時聊將賤子題襟之意他日者春風桃李收拾藥籠當結束青鞋與壽喬重問勾漏消息未識三生一笑果有舊因緣否也嘉慶九年陬月二十有六日吳江同研弟沈翿拜手跋
